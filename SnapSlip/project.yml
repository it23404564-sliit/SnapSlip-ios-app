# XcodeGen spec — a fallback if SnapSlip.xcodeproj ever fails to open.
#   brew install xcodegen && xcodegen generate
name: SnapSlip
options:
  bundleIdPrefix: lk.sliit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SnapSlip:
    type: application
    platform: iOS
    sources: [SnapSlip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.sliit.snapslip
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        INFOPLIST_KEY_CFBundleDisplayName: SnapSlip
        INFOPLIST_KEY_NSCameraUsageDescription: SnapSlip uses the camera to scan your receipts. Images are processed on your device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  SnapSlipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SnapSlipTests]
    dependencies: [{target: SnapSlip}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SnapSlipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SnapSlipUITests]
    dependencies: [{target: SnapSlip}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SnapSlip:
    build:
      targets: {SnapSlip: all}
    test:
      gatherCoverageData: true
      targets: [SnapSlipTests, SnapSlipUITests]
